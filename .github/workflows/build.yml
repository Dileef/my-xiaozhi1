name: Build ESP32-S3 Super Mini

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Firmware and Merge Bin
        shell: bash
        run: |
          # Source the official ESP-IDF environment script
          . /opt/esp/idf/export.sh
          
          # Set the required CONFIG environment variable for the board
          export CONFIG=bread-compact-wifi
          
          # Run the build script
          python3 scripts/build.py bread-compact-wifi --name bread-compact-wifi

      - name: Upload Compiled Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-s3-super-mini-firmware
          path: |
            releases/*.zip
            build/*.bin